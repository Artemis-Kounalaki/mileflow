spring.application.name=app
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/mileflow
keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=mileflow
keycloak.admin.client-id=mileflow-admin
keycloak.admin.client-secret=${SECRET}