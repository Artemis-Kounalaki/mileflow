services:
  mysql:
    image: mysql:8.0
    container_name: mileflow-mysql
    environment:
      MYSQL_DATABASE: mileflow
      MYSQL_USER: mileflow_user
      MYSQL_PASSWORD: mileflow_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: