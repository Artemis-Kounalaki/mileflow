services:

  mysql:
    image: mysql:8.0
    container_name: mileflow-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: mileflow-keycloak

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:8081

    volumes:
      - ./keycloak:/opt/keycloak/data/import

    ports:
      - "8081:8080"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mileflow-backend

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/mileflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mileflow/protocol/openid-connect/certs

      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: mileflow
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: mileflow-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  mysql_data: